<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>固定画面点击揭秘示例</title>
<body style="margin:0;background:#F7F5F0;color:#1F2937;font-family:system-ui,sans-serif;">
<main style="max-width:640px;margin:40px auto;padding:24px;">
  <h1 style="font-size:24px;">固定画面点击揭秘</h1>
  <p style="font-size:16px;line-height:1.8;">点击下方画面查看答案，前后占位高度相同。刷新页面可重新体验。</p>
  <section style="margin:20px 0;padding:0;line-height:0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" style="display:block;width:100%;height:auto;cursor:pointer;" data-component="wechat-svg-click-reveal" role="img" aria-label="点一下，查看答案">
  <desc>点击画面，在固定区域内显示答案。刷新后可重新体验。</desc>
  <rect x="1" y="1" width="598" height="358" rx="16" fill="#FFF8EE" stroke="#D97706" stroke-width="2" />
  <path d="M40 58 H100" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round" />
    <text x="40" y="142" fill="#1F2937" font-size="36" font-family="sans-serif" xml:space="preserve">点一下，查看答案</text>
  <g opacity="0" data-reveal-layer="answer">
    <rect x="1" y="1" width="598" height="358" rx="16" fill="#FFF8EE" stroke="#D97706" stroke-width="2" />
    <text x="40" y="58" fill="#1F2937" font-size="36" font-weight="700" font-family="sans-serif">答案</text>
    <text x="40" y="120" fill="#1F2937" font-size="36" font-family="sans-serif" xml:space="preserve">先准备正文、参考文章和图片，</text>
    <text x="40" y="164" fill="#1F2937" font-size="36" font-family="sans-serif" xml:space="preserve">再让AI检查缺项。</text>
    <animate attributeName="opacity" begin="click" dur="0.28s" from="0" to="1" fill="freeze" restart="never" />
    <rect x="0" y="0" width="600" height="360" fill="#000000" fill-opacity="0" pointer-events="all" data-reveal-trigger="tap" />
  </g>
</svg>
</section>

</main>
</body>
</html>
