<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG描边分隔线示例</title>
<body style="margin:0;background:#F7F5F0;color:#1F2937;font-family:system-ui,sans-serif;">
<main style="max-width:640px;margin:40px auto;padding:24px;">
  <h1 style="font-size:24px;">SVG描边分隔线</h1>
  <p style="font-size:16px;line-height:1.8;">观察线条从左向右画出。刷新页面可再次观察单次播放。</p>
  <section style="margin:16px 0;padding:0;line-height:0;" data-component="wechat-svg-drawline">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 48" width="100%" style="display:block;width:100%;height:auto;" role="img" aria-label="描边分隔线">
  <desc>线条从左向右描画，完成后保持完整状态。</desc>
  <path d="M 16 24 H 584" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.6;1" dur="2.8s" begin="0s" repeatCount="1" fill="freeze" />
  </path>
</svg>
</section>

  <p style="font-size:16px;line-height:1.8;">这段正文保留为普通HTML文字，方便编辑和复制。</p>
</main>
</body>
</html>
