<!doctype html>
<html lang="zh-CN">

<main style="max-width:600px;margin:24px auto;padding:16px;">
<h1 style="font-size:24px;line-height:1.5;">多热区点击与返回</h1>
<p style="font-size:16px;line-height:1.8;">点开各个节点，再返回总图。组件高度保持一致。</p>
<section style="margin:20px 0;padding:0;line-height:0;">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="100%" style="display:block;width:100%;height:auto;" data-component="wechat-svg-hotspots" data-instance="hotspots_4812592a932a4a66" role="group" aria-label="多热区点击查看说明">
<desc>点击编号热区打开对应说明，点击返回回到总图。</desc>
<rect width="600" height="600" rx="20" fill="#FFF9EE"/>
<text x="40" y="60" fill="#1F2937" font-size="36" font-weight="700" font-family="sans-serif" xml:space="preserve">点开三个制作节点</text>
<text x="40" y="132" fill="#52616A" font-size="24" font-weight="400" font-family="sans-serif" xml:space="preserve">点击卡片查看，再点返回</text>
<path d="M42 565 Q175 530 305 563 T555 561" fill="none" stroke="#197B8B" stroke-width="3" stroke-dasharray="5 10" opacity="0.35"/>

<rect x="40" y="150" width="520" height="76" rx="14" fill="#FFF9EE" fill-opacity="0.94" stroke="#197B8B" stroke-width="2" pointer-events="all"/>
<circle cx="71" cy="188" r="20" fill="#197B8B" pointer-events="none"/>
<text x="61" y="199" fill="#FFFFFF" font-size="30" font-weight="700" font-family="sans-serif" xml:space="preserve">1</text>
<text x="106" y="200" fill="#1F2937" font-size="32" font-weight="700" font-family="sans-serif" xml:space="preserve">收齐客户材料</text>
</g>
<g id="hotspots_4812592a932a4a66_open_1" data-hotspot="1" style="cursor:pointer;" role="button" aria-label="确认每页文字">
<rect x="40" y="250" width="520" height="76" rx="14" fill="#FFF9EE" fill-opacity="0.94" stroke="#197B8B" stroke-width="2" pointer-events="all"/>
<circle cx="71" cy="288" r="20" fill="#197B8B" pointer-events="none"/>
<text x="61" y="299" fill="#FFFFFF" font-size="30" font-weight="700" font-family="sans-serif" xml:space="preserve">2</text>
<text x="106" y="300" fill="#1F2937" font-size="32" font-weight="700" font-family="sans-serif" xml:space="preserve">确认每页文字</text>
</g>
<g id="hotspots_4812592a932a4a66_open_2" data-hotspot="2" style="cursor:pointer;" role="button" aria-label="确认样稿风格">

<circle cx="71" cy="388" r="20" fill="#197B8B" pointer-events="none"/>
<text x="61" y="399" fill="#FFFFFF" font-size="30" font-weight="700" font-family="sans-serif" xml:space="preserve">3</text>
<text x="106" y="400" fill="#1F2937" font-size="32" font-weight="700" font-family="sans-serif" xml:space="preserve">确认样稿风格</text>

<g opacity="0" data-hotspot-fade="0">
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="hotspots_4812592a932a4a66_open_0.click" fill="freeze" restart="always"/>
<rect width="600" height="600" rx="20" fill="#FFF9EE" pointer-events="visiblePainted"/>
<path d="M40 150 H560" stroke="#197B8B" stroke-width="3"/>
<text x="40" y="70" fill="#1F2937" font-size="36" font-weight="700" font-family="sans-serif" xml:space="preserve">先把材料收齐</text>
<text x="40" y="206" fill="#1F2937" font-size="36" font-weight="400" font-family="sans-serif" xml:space="preserve">把收到的文件发回群里，</text>
<text x="40" y="250" fill="#1F2937" font-size="36" font-weight="400" font-family="sans-serif" xml:space="preserve">请客户确认有无补充。</text>
<text x="40" y="294" fill="#1F2937" font-size="36" font-weight="400" font-family="sans-serif" xml:space="preserve">资料齐全后再交给 AI。</text>

</g>
</g>
<g visibility="hidden" style="visibility:hidden;" data-hotspot-detail="1">

<text x="40" y="206" fill="#1F2937" font-size="36" font-weight="400" font-family="sans-serif" xml:space="preserve">让客户逐页检查标题和正文。</text>
<text x="40" y="250" fill="#1F2937" font-size="36" font-weight="400" font-family="sans-serif" xml:space="preserve">这里的文字会放进对应页面。</text>
<text x="40" y="294" fill="#1F2937" font-size="36" font-weight="400" font-family="sans-serif" xml:space="preserve">确认后再制作整套。</text>

<g visibility="hidden" style="visibility:hidden;" data-hotspot-detail="2">
<set attributeName="visibility" to="visible" begin="hotspots_4812592a932a4a66_open_2.click" end="hotspots_4812592a932a4a66_back_2.click" restart="always"/>
<g opacity="0" data-hotspot-fade="2">
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="hotspots_4812592a932a4a66_open_2.click" fill="freeze" restart="always"/>

<path d="M40 150 H560" stroke="#197B8B" stroke-width="3"/>
<text x="40" y="70" fill="#1F2937" font-size="36" font-weight="700" font-family="sans-serif" xml:space="preserve">把视觉方向对齐</text>
<text x="40" y="206" fill="#1F2937" font-size="36" font-weight="400" font-family="sans-serif" xml:space="preserve">用三到五页展示配色和排版。</text>
<text x="40" y="250" fill="#1F2937" font-size="36" font-weight="400" font-family="sans-serif" xml:space="preserve">客户明确同意继续后，</text>
<text x="40" y="294" fill="#1F2937" font-size="36" font-weight="400" font-family="sans-serif" xml:space="preserve">再沿用这套方向完成终稿。</text>
<g id="hotspots_4812592a932a4a66_back_2" data-hotspot-back="2" role="button" aria-label="返回总图" style="cursor:pointer;">
<rect x="40" y="500" width="520" height="60" rx="14" fill="#197B8B" pointer-events="visiblePainted"/>
