<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>点击逐层掉落</title><body style="margin:0;background:#F5F3EE;font-family:system-ui,sans-serif;">
<main style="max-width:640px;margin:30px auto;padding:16px;box-sizing:border-box;">
<h1 style="font-size:24px;">点击逐层掉落</h1><p style="line-height:1.7;">点击画面揭开下一层，最后一张会一直留下。刷新可重看。</p>
<section style="margin:20px 0;padding:0;line-height:0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" style="display:block;width:100%;height:auto;overflow:hidden;" font-family="sans-serif" fill="#1F2937" data-component="wechat-svg-layer-peel" role="img" aria-label="点击画面逐层查看内容">
<desc>每次点击移走一层，最后一张一直保留。刷新预览可重新体验。</desc>
<g id="peel_2d052a6ab4bf4830981fb3796fae8019_layer_2" data-peel-layer="2" data-final="true" style="pointer-events:auto;">
  
  <rect x="1" y="1" width="598" height="418" rx="20" fill="#FFF8EE" stroke="#D97706" stroke-width="2" />
  <path d="M36 46 H104" stroke="#D97706" stroke-width="5" stroke-linecap="round" />
  <text x="564" y="52" text-anchor="end" fill="#D97706" font-size="27">3 / 3</text>
  <text x="36" y="104" font-size="34" font-weight="700">最后，跑通完整交付</text>
  <text x="36" y="155" font-size="34">把整套结果检查一遍。</text>
<text x="36" y="198" font-size="34">确认能打开、能阅读、能修改。</text>
  <rect x="36" y="338" width="528" height="58" rx="12" fill="#D97706" />
  <text x="300" y="377" text-anchor="middle" font-size="30" fill="#FFFFFF">已经看到最后一张啦</text>
  
</g>
<g id="peel_2d052a6ab4bf4830981fb3796fae8019_layer_1" data-peel-layer="1" data-final="false" style="pointer-events:auto;">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="0 440" begin="click" dur="0.45s" fill="freeze" restart="never" />
  <set attributeName="pointer-events" to="none" begin="click" fill="freeze" />
  <set attributeName="display" to="none" begin="click+0.45s" fill="freeze" />
  <rect x="1" y="1" width="598" height="418" rx="20" fill="#FFF8EE" stroke="#D97706" stroke-width="2" />
  <path d="M36 46 H104" stroke="#D97706" stroke-width="5" stroke-linecap="round" />
  <text x="564" y="52" text-anchor="end" fill="#D97706" font-size="27">2 / 3</text>
  <text x="36" y="104" font-size="34" font-weight="700">第二层，确认方向</text>
  <text x="36" y="155" font-size="34">先看一小段样稿。</text>
<text x="36" y="198" font-size="34">文字和视觉都确认，再继续。</text>
  <rect x="36" y="338" width="528" height="58" rx="12" fill="#D97706" />
  <text x="300" y="377" text-anchor="middle" font-size="30" fill="#FFFFFF">点击画面，揭开下一层 ↓</text>
  <rect data-peel-trigger="next" x="0" y="0" width="600" height="420" fill="#000000" fill-opacity="0" style="cursor:pointer;" />
</g>
<g id="peel_2d052a6ab4bf4830981fb3796fae8019_layer_0" data-peel-layer="0" data-final="false" style="pointer-events:auto;">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="0 440" begin="click" dur="0.45s" fill="freeze" restart="never" />

  <set attributeName="display" to="none" begin="click+0.45s" fill="freeze" />
  <rect x="1" y="1" width="598" height="418" rx="20" fill="#FFF8EE" stroke="#D97706" stroke-width="2" />
  <path d="M36 46 H104" stroke="#D97706" stroke-width="5" stroke-linecap="round" />
  <text x="564" y="52" text-anchor="end" fill="#D97706" font-size="27">1 / 3</text>
  <text x="36" y="104" font-size="34" font-weight="700">第一层，先收齐资料</text>
  <text x="36" y="155" font-size="34">把需求、文字和参考图放一起。</text>
<text x="36" y="198" font-size="34">先搞清楚这份内容要做给谁看。</text>
  <rect x="36" y="338" width="528" height="58" rx="12" fill="#D97706" />
  <text x="300" y="377" text-anchor="middle" font-size="30" fill="#FFFFFF">点击画面，揭开下一层 ↓</text>
  <rect data-peel-trigger="next" x="0" y="0" width="600" height="420" fill="#000000" fill-opacity="0" style="cursor:pointer;" />
</g>
</svg>
</section>
</main></body></html>
