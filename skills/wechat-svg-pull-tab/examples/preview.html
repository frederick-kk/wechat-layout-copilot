<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>侧边抽拉标签</title><body style="margin:0;background:#F5F3ED;color:#27383F;font-family:system-ui,sans-serif;">
<main style="max-width:600px;margin:24px auto;padding:16px;"><h1 style="font-size:24px;">侧边抽拉标签</h1><p style="line-height:1.8;">点击“拉”标签抽出信息，阅读后点击“收”放回。</p><section style="margin:22px 0;line-height:0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" style="display:block;width:100%;height:auto;overflow:hidden;" data-component="wechat-svg-pull-tab" role="group">
<rect width="600" height="520" rx="20" fill="#FFF9EF"/>
<text x="28" y="53" font-size="36" fill="#27383F" font-weight="700" font-family="sans-serif" xml:space="preserve">把一条线索抽出来</text>

<g id="pull_b33644324ccf4a31940838ca655d4f46_paper" data-pull-paper="true" transform="translate(-310 0)"><animateTransform attributeName="transform" type="translate" from="-310 0" to="0 0" begin="pull_b33644324ccf4a31940838ca655d4f46_open.click" dur="0.7s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="-310 0" begin="pull_b33644324ccf4a31940838ca655d4f46_close.click" dur="0.7s" fill="freeze"/><rect x="60" y="140" width="480" height="270" rx="12" fill="#FFFFFF" stroke="#167E99" stroke-width="3"/><path d="M210 160V390" stroke="#167E99" stroke-dasharray="6 6"/>
<g id="pull_b33644324ccf4a31940838ca655d4f46_message" data-pull-message="true" visibility="hidden" style="visibility:hidden;"><set attributeName="visibility" to="hidden" begin="pull_b33644324ccf4a31940838ca655d4f46_open.click;pull_b33644324ccf4a31940838ca655d4f46_close.click" fill="freeze"/><set attributeName="visibility" to="visible" begin="pull_b33644324ccf4a31940838ca655d4f46_open.click+0.7s" fill="freeze"/><text x="230" y="205" font-size="32" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">先跑通一个小流程</text>
<text x="230" y="250" font-size="32" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">把结果做成作品</text>
<text x="230" y="295" font-size="32" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">再交给真实反馈</text></g></g>
<rect x="0" y="120" width="190" height="310" rx="15" fill="#167E99"/><path d="M170 145V405" stroke="#FFFFFF" stroke-dasharray="7 7" stroke-width="3"/><text x="35" y="270" font-size="36" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">线索</text>
<g id="pull_b33644324ccf4a31940838ca655d4f46_open" data-action="open" visibility="visible" style="visibility:visible;cursor:pointer;">
<set attributeName="visibility" to="hidden" begin="pull_b33644324ccf4a31940838ca655d4f46_open.click;pull_b33644324ccf4a31940838ca655d4f46_close.click" fill="freeze"/>
<set attributeName="visibility" to="visible" begin="pull_b33644324ccf4a31940838ca655d4f46_close.click+0.7s" fill="freeze"/>
<rect x="210" y="220" width="60" height="100" rx="12" fill="#167E99"/>
<text x="240" y="281" text-anchor="middle" font-size="32" fill="#FFFFFF" style="pointer-events:none;">拉</text>
</g>
<g id="pull_b33644324ccf4a31940838ca655d4f46_close" data-action="close" visibility="hidden" style="visibility:hidden;cursor:pointer;">
<set attributeName="visibility" to="hidden" begin="pull_b33644324ccf4a31940838ca655d4f46_open.click;pull_b33644324ccf4a31940838ca655d4f46_close.click" fill="freeze"/>
<set attributeName="visibility" to="visible" begin="pull_b33644324ccf4a31940838ca655d4f46_open.click+0.7s" fill="freeze"/>
<rect x="520" y="220" width="60" height="100" rx="12" fill="#167E99"/>
<text x="550" y="281" text-anchor="middle" font-size="32" fill="#FFFFFF" style="pointer-events:none;">收</text>
</g>
<text x="28" y="489" font-size="28" fill="#68777E" font-weight="400" font-family="sans-serif" xml:space="preserve">点击侧边标签，抽出或收回信息</text>
</svg></section></main></body></html>
