<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>单题点击答题</title><body style="margin:0;background:#F5F3ED;font-family:system-ui,sans-serif;color:#27383F;">
<main style="max-width:600px;margin:24px auto;padding:16px;"><h1 style="font-size:24px;">单题点击答题</h1><p style="line-height:1.8;">每个答案都有对应反馈，返回后可以重选。</p><section style="margin:22px 0;line-height:0;">

<text x="36" y="244" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">先确认每页的具体文字。</text>
<text x="36" y="288" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">再确认排版和视觉方向。</text>
