<section style="margin:22px 0;line-height:0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="100%" style="display:block;width:100%;height:auto;" data-component="wechat-svg-story-branches" role="group" aria-label="选择不同路径阅读故事">
<desc>点击选项继续下一步，在结局处可以回到起点。</desc>
<g id="story_503d79f6029745649d2160c6482a43e4_node_start" data-story-node="start" display="inline" style="display:inline;">
<set attributeName="display" to="inline" begin="story_503d79f6029745649d2160c6482a43e4_restart_delivery.click;story_503d79f6029745649d2160c6482a43e4_restart_materials.click" fill="freeze"/>
<set attributeName="display" to="none" begin="story_503d79f6029745649d2160c6482a43e4_pick_start_0.click;story_503d79f6029745649d2160c6482a43e4_pick_start_1.click" fill="freeze"/>
<rect width="600" height="640" rx="20" fill="#FFF8ED"/>
<path d="M36 34H106" stroke="#8C6544" stroke-width="5" stroke-linecap="round"/>
<text x="36" y="90" font-size="36" fill="#27383F" font-weight="700" font-family="sans-serif" xml:space="preserve">你准备怎样开始？</text>
<text x="36" y="200" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">选一条更适合自己的路。</text>
<text x="36" y="244" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">接下来还会遇到一次选择。</text>
<g id="story_503d79f6029745649d2160c6482a43e4_pick_start_0" data-story-choice="0" style="cursor:pointer;">
<rect x="36" y="360" width="528" height="66" rx="12" fill="#8C6544"/>
<text x="58" y="404" font-size="32" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">先做一份练习作品</text>
</g><g id="story_503d79f6029745649d2160c6482a43e4_pick_start_1" data-story-choice="1" style="cursor:pointer;">
<rect x="36" y="442" width="528" height="66" rx="12" fill="#8C6544"/>
<text x="58" y="486" font-size="32" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">先找一个真实小需求</text>
</g>
</g><g id="story_503d79f6029745649d2160c6482a43e4_node_practice" data-story-node="practice" display="none" style="display:none;">
<set attributeName="display" to="inline" begin="story_503d79f6029745649d2160c6482a43e4_pick_start_0.click" fill="freeze"/>
<set attributeName="display" to="none" begin="story_503d79f6029745649d2160c6482a43e4_pick_practice_0.click;story_503d79f6029745649d2160c6482a43e4_pick_practice_1.click" fill="freeze"/>
<rect width="600" height="640" rx="20" fill="#FFF8ED"/>
<path d="M36 34H106" stroke="#8C6544" stroke-width="5" stroke-linecap="round"/>
<text x="36" y="90" font-size="36" fill="#27383F" font-weight="700" font-family="sans-serif" xml:space="preserve">练习作品已经做好</text>
<text x="36" y="200" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">下一步想先推进什么？</text>
<g id="story_503d79f6029745649d2160c6482a43e4_pick_practice_0" data-story-choice="0" style="cursor:pointer;">
<rect x="36" y="360" width="528" height="66" rx="12" fill="#8C6544"/>
<text x="58" y="404" font-size="32" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">带着作品联系合作方</text>
</g><g id="story_503d79f6029745649d2160c6482a43e4_pick_practice_1" data-story-choice="1" style="cursor:pointer;">
<rect x="36" y="442" width="528" height="66" rx="12" fill="#8C6544"/>
<text x="58" y="486" font-size="32" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">先检查源文件能否修改</text>
</g>
</g><g id="story_503d79f6029745649d2160c6482a43e4_node_task" data-story-node="task" display="none" style="display:none;">
<set attributeName="display" to="inline" begin="story_503d79f6029745649d2160c6482a43e4_pick_start_1.click" fill="freeze"/>
<set attributeName="display" to="none" begin="story_503d79f6029745649d2160c6482a43e4_pick_task_0.click;story_503d79f6029745649d2160c6482a43e4_pick_task_1.click" fill="freeze"/>
<rect width="600" height="640" rx="20" fill="#FFF8ED"/>
<path d="M36 34H106" stroke="#8C6544" stroke-width="5" stroke-linecap="round"/>
<text x="36" y="90" font-size="36" fill="#27383F" font-weight="700" font-family="sans-serif" xml:space="preserve">有人愿意让你试一试</text>
<text x="36" y="200" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">先看看材料是否齐全。</text>
<g id="story_503d79f6029745649d2160c6482a43e4_pick_task_0" data-story-choice="0" style="cursor:pointer;">
<rect x="36" y="360" width="528" height="66" rx="12" fill="#8C6544"/>
<text x="58" y="404" font-size="32" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">资料齐全，确认交付范围</text>
</g><g id="story_503d79f6029745649d2160c6482a43e4_pick_task_1" data-story-choice="1" style="cursor:pointer;">
<rect x="36" y="442" width="528" height="66" rx="12" fill="#8C6544"/>
<text x="58" y="486" font-size="32" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">还缺材料，整理补充清单</text>
</g>
</g><g id="story_503d79f6029745649d2160c6482a43e4_node_delivery" data-story-node="delivery" display="none" style="display:none;">
<set attributeName="display" to="inline" begin="story_503d79f6029745649d2160c6482a43e4_pick_practice_0.click;story_503d79f6029745649d2160c6482a43e4_pick_task_0.click" fill="freeze"/>
<set attributeName="display" to="none" begin="story_503d79f6029745649d2160c6482a43e4_restart_delivery.click" fill="freeze"/>
<rect width="600" height="640" rx="20" fill="#FFF8ED"/>
<path d="M36 34H106" stroke="#8C6544" stroke-width="5" stroke-linecap="round"/>
<text x="36" y="90" font-size="36" fill="#27383F" font-weight="700" font-family="sans-serif" xml:space="preserve">带着作品，往前一步</text>
<text x="36" y="200" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">你已经走到了真实交付。</text>
<text x="36" y="244" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">把这次过程记录下来，</text>
<text x="36" y="288" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">下次就多了一份可复用经验。</text>
<g id="story_503d79f6029745649d2160c6482a43e4_restart_delivery" data-story-restart="delivery" style="cursor:pointer;">
<rect x="36" y="510" width="528" height="66" rx="12" fill="#8C6544"/>
<text x="118" y="554" font-size="30" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">回到起点，再走一条路</text>
</g>
</g><g id="story_503d79f6029745649d2160c6482a43e4_node_materials" data-story-node="materials" display="none" style="display:none;">

<rect width="600" height="640" rx="20" fill="#FFF8ED"/>
<path d="M36 34H106" stroke="#8C6544" stroke-width="5" stroke-linecap="round"/>
<text x="36" y="90" font-size="36" fill="#27383F" font-weight="700" font-family="sans-serif" xml:space="preserve">把准备工作做扎实</text>
<text x="36" y="200" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">检查素材和可编辑文件。</text>
<text x="36" y="244" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">把缺项补齐后再继续推进，</text>
<text x="36" y="288" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">也能为后面省下返工时间。</text>
<g id="story_503d79f6029745649d2160c6482a43e4_restart_materials" data-story-restart="materials" style="cursor:pointer;">
<rect x="36" y="510" width="528" height="66" rx="12" fill="#8C6544"/>
