<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>点击擦拭前后对比</title><body style="margin:0;background:#F5F3ED;font-family:system-ui,sans-serif;color:#27383F;">
<main style="max-width:600px;margin:24px auto;padding:16px;"><h1 style="font-size:24px;">点击擦拭前后对比</h1><p style="line-height:1.8;">点击亮起的按钮切换，动画完成后可以切回。</p><section style="margin:22px 0;line-height:0;">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="100%" style="display:block;width:100%;height:auto;" data-component="wechat-svg-wipe-compare" role="group" aria-label="点击擦拭查看前后对比">
<desc>点击右侧按钮擦出制作后画面，点击左侧按钮回到制作前。</desc>
<rect width="600" height="600" rx="20" fill="#FFF9EF"/>
<text x="30" y="48" font-size="36" fill="#27383F" font-weight="700" font-family="sans-serif" xml:space="preserve">同一份内容，看看前后变化</text>
<rect x="0" y="80" width="600" height="390" fill="#FFF9EF"/>
<path d="M32 122H568 M32 432H568" stroke="#A9B4B9" stroke-width="2" stroke-dasharray="5 8"/>
<text x="40" y="170" font-size="36" fill="#68777E" font-weight="700" font-family="sans-serif" xml:space="preserve">信息放在一起</text>
<text x="40" y="284" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">标题和内容没有分组。</text>
<text x="40" y="326" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">读者需要自己寻找重点。</text>
<rect x="20" y="92" width="200" height="44" rx="10" fill="#68777E"/>
<text x="34" y="123" font-size="26" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">制作前</text>
<svg x="-600" y="0" width="600" height="480" overflow="hidden" style="width:600px;height:480px;overflow:hidden;" data-wipe-layer="after">
<animate attributeName="x" attributeType="XML" from="-600" to="0" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_after.click" dur="0.7s" fill="freeze"/>
<animate attributeName="x" attributeType="XML" from="0" to="-600" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_before.click" dur="0.7s" fill="freeze"/>
<g transform="translate(600 0)" data-wipe-content="after">
<animateTransform attributeName="transform" type="translate" from="600 0" to="0 0" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_after.click" dur="0.7s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 0" to="600 0" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_before.click" dur="0.7s" fill="freeze"/>
<rect x="0" y="80" width="600" height="390" fill="#FFF9EF"/>
<rect x="32" y="112" width="536" height="326" rx="18" fill="#FFFFFF" stroke="#177F91" stroke-width="2"/>
<rect x="52" y="150" width="8" height="250" rx="4" fill="#177F91"/>
<text x="80" y="170" font-size="36" fill="#177F91" font-weight="700" font-family="sans-serif" xml:space="preserve">先分组，再强调重点</text>
<text x="80" y="284" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">把相关信息放在一起。</text>
<text x="80" y="326" font-size="34" fill="#27383F" font-weight="400" font-family="sans-serif" xml:space="preserve">用层级带着读者往下看。</text>
<rect x="20" y="92" width="200" height="44" rx="10" fill="#177F91"/>
<text x="34" y="123" font-size="26" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">制作后</text>
</g>
</svg>
<g id="wipe_57f07bd5fcfe4828afd835609c5bf80f_before" data-wipe-trigger="before" opacity="0.45" style="cursor:pointer;pointer-events:none;opacity:0.45;">
<set attributeName="pointer-events" to="none" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_after.click;wipe_57f07bd5fcfe4828afd835609c5bf80f_before.click" fill="freeze"/>
<set attributeName="pointer-events" to="auto" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_after.click+0.7s" fill="freeze"/>
<set attributeName="opacity" to="0.45" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_after.click;wipe_57f07bd5fcfe4828afd835609c5bf80f_before.click" fill="freeze"/>
<set attributeName="opacity" to="1" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_after.click+0.7s" fill="freeze"/>
<rect x="24" y="510" width="264" height="62" rx="12" fill="#68777E"/>
<text x="70" y="551" font-size="30" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">回到制作前</text>
</g>
<g id="wipe_57f07bd5fcfe4828afd835609c5bf80f_after" data-wipe-trigger="after" opacity="1" style="cursor:pointer;pointer-events:auto;opacity:1;">
<set attributeName="pointer-events" to="none" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_after.click;wipe_57f07bd5fcfe4828afd835609c5bf80f_before.click" fill="freeze"/>
<set attributeName="pointer-events" to="auto" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_before.click+0.7s" fill="freeze"/>
<set attributeName="opacity" to="0.45" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_after.click;wipe_57f07bd5fcfe4828afd835609c5bf80f_before.click" fill="freeze"/>
<set attributeName="opacity" to="1" begin="wipe_57f07bd5fcfe4828afd835609c5bf80f_before.click+0.7s" fill="freeze"/>
<rect x="312" y="510" width="264" height="62" rx="12" fill="#177F91"/>
<text x="358" y="551" font-size="30" fill="#FFFFFF" font-weight="700" font-family="sans-serif" xml:space="preserve">查看制作后</text>
</g>
</svg></section>
</main></body></html>
